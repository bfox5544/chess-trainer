[project]
name = "chess-trainer"
version = "0.1.0"
description = "Personalized chess training from your own Lichess and Chess.com games"
authors = [
    { name = "Brandon Fox", email = "2brandonfox@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "chess>=1.11.2",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[project.scripts]
chess-trainer-worker = "chess_trainer.jobs.worker:main"
chess-trainer-puzzle-library = "chess_trainer.library.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults is the documented idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Postgres test database from docker-compose",
    "stockfish: needs a real Stockfish binary (skipped when missing)",
]
