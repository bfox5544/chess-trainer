services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_trainer
    ports:
      # Unusual host port so this never collides with a Postgres already on 5432.
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate chess_trainer_test database on first start.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_trainer"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
